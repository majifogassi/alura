<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barra de Pesquisa</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.search-box{
    width:400px;
    display:flex;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
    border-radius:30px;
    overflow:hidden;
}

.search-box input{
    flex:1;
    padding:15px;
    border:none;
    outline:none;
    font-size:16px;
}

.search-box button{
    background:#24292e;
    color:white;
    border:none;
    padding:15px 20px;
    cursor:pointer;
    transition:.3s;
}

.search-box button:hover{
    background:#0366d6;
}
</style>

</head>
<body>

<form class="search-box" action="https://www.google.com/search" method="GET">
    <input
        type="text"
        name="q"
        placeholder="Pesquisar..."
        autocomplete="off">
    <button type="submit">🔍</button>
</form>

</body>
</html>
